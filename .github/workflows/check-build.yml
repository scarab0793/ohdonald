name: Check generated site
# Fails when data/*.json was edited but `python3 scripts/build.py` was not re-run,
# so the published pages can never drift from the data.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild the site
        run: python3 scripts/build.py
      - name: Fail if generated files are out of date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated files are out of date. Run: python3 scripts/build.py and commit the result."
            git status --short
            exit 1
          fi
