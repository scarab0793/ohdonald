name: Collect fact-check leads
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download independent fact-check RSS leads
        run: python3 scripts/collect_factcheck_leads.py
      - name: Upload research leads as a run artifact (not website content)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unreviewed-factcheck-leads
          path: research/factcheck-leads.json
          retention-days: 30
          if-no-files-found: ignore
