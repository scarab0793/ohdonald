name: Collect fact-check leads
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Download independent fact-check RSS leads
        run: |
          mkdir -p leads
          python3 - <<'PY'
          import urllib.request, xml.etree.ElementTree as ET, json, datetime
          feeds = {
            "FactCheck.org": "https://www.factcheck.org/feed/",
            "PolitiFact": "https://www.politifact.com/rss/factchecks/"
          }
          results=[]
          for name,url in feeds.items():
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"OhDonaldResearch/1.0"})
              with urllib.request.urlopen(req,timeout=25) as r: root=ET.fromstring(r.read())
              for item in root.findall(".//item")[:30]:
                title=(item.findtext("title") or "").strip()
                link=(item.findtext("link") or "").strip()
                if "trump" in title.lower() or "donald" in title.lower():
                  results.append({"source":name,"title":title,"url":link,"status":"UNREVIEWED LEAD"})
            except Exception as exc:
              print(name,"unavailable:",type(exc).__name__)
          with open("leads/latest.json","w") as f:
            json.dump({"collected_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),"leads":results},f,indent=2)
          print("Unreviewed leads:",len(results))
          PY
      - name: Upload private research leads as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: unreviewed-factcheck-leads
          path: leads/latest.json
          retention-days: 14
